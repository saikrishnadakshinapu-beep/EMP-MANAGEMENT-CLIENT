<div class="grid">
  <div class="login-panel col-12 sm:col-0 md:col-7"></div>
  <div class="login col-12 sm:col-12 md:col-5">
    <form class="grid p-fluid" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="col-12">
        <div class="p-card">
          <div class="p-card-header">
            <h2 class="m-2 mt-5 ml-5">Welcome To Emp Management</h2>
          </div>
          <div class="p-card-body">
            <div class="grid p-fluid">
              <div class="col-12">
                <span class="p-float-label">
                  <input type="email" pInputText class="p-inputtext-sm" id="login-email" formControlName="email">
                  <label for="login-email">Email</label>
                </span>
                <small class="p-error" *ngIf="loginForm.controls.email.touched && loginForm.controls.email.invalid">
                  Enter a valid email address.
                </small>
              </div>
              <div class="col-12 mt-2">
                <span class="p-float-label">
                  <p-password inputId="login-password" formControlName="password" [toggleMask]="true"
                    [feedback]="false" autocomplete="current-password" styleClass="login-password"
                    inputStyleClass="p-inputtext-sm login-password-input"></p-password>
                  <label for="login-password">Password</label>
                </span>
                <small class="p-error" *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
                  Password must be at least 6 characters.
                </small>
              </div>
              <div class="col-12" *ngIf="loginError">
                <small class="p-error">{{loginError}}</small>
              </div>
              <div class="col-12">
                <button pButton type="submit" label="Login" [disabled]="isSubmitting"></button>
              </div>
              <div class="col-12 demo-credentials">
                <small>
                  Demo :<br>
                  Email: <strong>admin@example.com</strong><br>
                  Password: <strong>secret123</strong><br>
                   </small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
